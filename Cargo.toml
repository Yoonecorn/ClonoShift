[workspace]
members = ["crates/clonoshift", "crates/clonoshift-cli"]
resolver = "2"

[workspace.package]
version = "1.0.0"
edition = "2021"
license = "GPL-3.0-or-later"
rust-version = "1.85"

[workspace.dependencies]
csv = "=1.3.1"
sha2 = "=0.10.9"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = { version = "=1.0.145", features = ["float_roundtrip"] }
tempfile = "=3.23.0"
libc = "=0.2.177"
